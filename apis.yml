aid: grail
name: Grail
description: >-
  GRAIL, Inc. is a healthcare company headquartered in Menlo Park, California,
  focused on detecting cancer early, when it can be cured. Its flagship product,
  the Galleri multi-cancer early detection (MCED) test, uses a single blood draw
  and methylation-based genomic sequencing to screen for a signal shared across
  more than 50 types of cancer, many of which lack any recommended screening
  today. GRAIL runs large clinical programs including the PATHFINDER, PATHFINDER 2,
  and NHS-Galleri studies, and distributes Galleri through health plans, employers,
  and partners such as Quest Diagnostics and Junction. GRAIL is a portfolio company
  of investors including GV and SV Angel. It does not publish a first-party public
  developer API; programmatic access to Galleri ordering is offered through
  third-party diagnostic infrastructure partners.
